<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script>
      // Componente personalizado para aplicar blending aditivo + shader
      AFRAME.registerComponent('additive-shader', {
        init: function () {
          const video = document.getElementById('muitu');
          const texture = new THREE.VideoTexture(video);

          // Crear un material con un shader personalizado
          const material = new THREE.ShaderMaterial({
            uniforms: {
              baseTexture: { value: texture },
              threshold: { value: 0.6 } // Umbral para filtrar el negro
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D baseTexture;
              uniform float threshold;
              varying vec2 vUv;

              void main() {
                vec4 color = texture2D(baseTexture, vUv);
                float luminance = dot(color.rgb, vec3(0.299, 0.587, 0.114)); // Calcular luminancia
                if (luminance < threshold) {
                  discard; // Descartar píxeles oscuros
                }
                gl_FragColor = vec4(color.rgb, 1.0); // Mantener el color original
              }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthTest: false
          });

          // Aplicar el material al modelo
          this.el.getObject3D('mesh').material = material;
        }
      });
    </script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: assets/muitu.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="muitu" preload="auto" src="assets/muitu.webm" autoplay="true" loop="true" playsinline="true" muted="true"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Usar un plano con el componente personalizado -->
        <a-plane width="16" height="9" position="0 0 -5" additive-shader></a-plane>
      </a-entity>
    </a-scene>
  </body>
</html>
