<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <link href="style.css" rel="stylesheet" type="text/css"/>
</head>

<body>

  <!-- Pantalla de Carga -->
  <div id="splash-screen">
    <div id="loading-text" style="color: white; font-size: 24px; margin-bottom: 20px;">
      Cargando experiencia...
    </div>
    </div>
  <!-- Interfaz -->
  <!-- control de sonido -->
  <button id="sound-button" onclick="toggleSound()" aria-label="Toggle Sound">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <!-- Ícono de volumen -->
      <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.22-.91 7-4.49 7-8.77s-2.78-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/>
    </svg>
  </button>
  <!-- indicador de rotacion -->
  <div id="rotation-hint" class="hint-container">
    <img src="rotation.png" alt="Rotation" class="hint-icon">
  </div>
  <!-- Custom 
   force-webgl2 
   system-monitor 
   -->
  <a-scene mindar-image="imageTargetSrc: assets/targets.mind;" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true" id="ar-scene"   
    force-webgl2 
    system-monitor     
    >
                            <!-- assets para cada target -->
    <a-assets> 
      <!-- 0: aguaraguazu -->
      <a-asset-item id="model-0" src="assets/aguaraguazu.glb" ></a-asset-item>
      <!-- 1: boacuriyu -->
      <a-asset-item id="model-1" src="assets/boacuriyu.glb"></a-asset-item>
      <!-- 2: caraya -->
      <a-asset-item id="model-2" src="assets/caraya.glb"></a-asset-item>
      <!-- 3: carpincho -->
      <a-asset-item id="model-3" src="assets/carpincho.glb"></a-asset-item>
      <!-- 4: ciervo -->
      <a-asset-item id="model-4" src="assets/ciervo.glb"></a-asset-item>
      <!-- 5: dorado -->
      <a-asset-item id="model-5" src="assets/dorado.glb"></a-asset-item>
      <!-- 6: jabiru -->
      <a-asset-item id="model-6" src="assets/jabiru.glb"></a-asset-item>
      <!-- 7: jacana -->
      <a-asset-item id="model-7" src="assets/jacana.glb"></a-asset-item>
      <!-- 8: jaguarete -->
      <a-asset-item id="model-8" src="assets/jaguarete.glb"></a-asset-item>
      <!-- 9: nutria -->
      <a-asset-item id="model-9" src="assets/nutria.glb"></a-asset-item>
      <!-- 10: osohormiguero -->
      <a-asset-item id="model-10" src="assets/osohormiguero.glb"></a-asset-item>
      <!-- 11: tararira -->
      <a-asset-item id="model-11" src="assets/tararira.glb"></a-asset-item>
      <!-- 12: tordo -->
      <a-asset-item id="model-12" src="assets/tordo.glb"></a-asset-item>
      <!-- 13: venado -->
      <a-asset-item id="model-13" src="assets/venado.glb"></a-asset-item>
      <!-- 14: yacare -->
      <a-asset-item id="model-14" src="assets/yacare.glb"></a-asset-item>

      <!-- 15: yetapa -->
      <a-asset-item id="model-15" src="assets/yetapa.glb"></a-asset-item>

      <audio id="audio-0" src="assets/aguaraguazu.mp3" preload="auto" loop></audio>
      <audio id="audio-1" src="assets/boacuriyu.mp3" preload="auto" loop></audio>
      <audio id="audio-2" src="assets/caraya.mp3" preload="auto" loop></audio>
      <audio id="audio-3" src="assets/carpincho.mp3" loop preload="auto"></audio>
      <audio id="audio-4" src="assets/ciervo.mp3" loop preload="auto"></audio>
      <audio id="audio-5" src="assets/dorado.mp3" loop preload="auto"></audio>
      <audio id="audio-6" src="assets/jabiru.mp3" loop preload="auto"></audio>
      <audio id="audio-7" src="assets/jacana.mp3" loop preload="auto"></audio>
      <audio id="audio-8" src="assets/jaguarete.mp3" loop preload="auto"></audio>
      <audio id="audio-9" src="assets/nutria.mp3" loop preload="auto"></audio>
      <audio id="audio-10" src="assets/osohormiguero.mp3" loop preload="auto"></audio>
      <audio id="audio-11" src="assets/tararira.mp3" loop preload="auto"></audio>
      <audio id="audio-12" src="assets/tordo.mp3" loop preload="auto"></audio>
      <audio id="audio-13" src="assets/venado.mp3" loop preload="auto"></audio>
      <audio id="audio-14" src="assets/yacare.mp3" loop preload="auto"></audio>
      <audio id="audio-15" src="assets/yetapa.mp3" loop preload="auto"></audio>
    </a-assets>



                               <!-- entidades para cada target -->
    <!-- 0: aguaraguazu -->
    <a-entity mindar-image-target="targetIndex: 0" data-index="0" id="target-0">
      <a-entity gltf-model="#model-0" 
                scale="0.15 0.15 0.15" 
                position="0 0 0" 
                rotation="0 -90 0"
                custom-rotation="sensitivity: 0.2">
      </a-entity>
    </a-entity>

    <!-- 1: boacuriyu -->
    <a-entity mindar-image-target="targetIndex: 1" data-index="1" id="target-1">

      <a-entity gltf-model="#model-1" scale="0.03 0.03 0.03" position="0 0 0" rotation="45 15 0"
        custom-rotation="sensitivity: 0.2">
      </a-entity>

    </a-entity>

    <!-- 2: caraya -->
    <a-entity mindar-image-target="targetIndex: 2" data-index="2" id="target-2">

      <a-entity gltf-model="#model-2" scale="0.1 0.1 0.1" position="0 0 0" rotation="0 0 0"
        custom-rotation="sensitivity: 0.2">
      </a-entity>
    </a-entity>

    <!-- 3: carpincho -->
    <a-entity mindar-image-target="targetIndex: 3" data-index="3" id="target-3">

      <a-entity gltf-model="#model-3" scale="0.7 0.7 0.7" position="0 0 0" rotation="0 -90 0"
        custom-rotation="sensitivity: 0.2"></a-entity>
    </a-entity>

    <!-- 4: ciervo -->
    <a-entity mindar-image-target="targetIndex: 4" data-index="4" id="target-4">

      <a-entity gltf-model="#model-4" scale="0.1 0.1 0.1" position="0 0 0" rotation="0 -90 0"
        custom-rotation="sensitivity: 0.2"></a-entity>
    </a-entity>

    <!-- 5: dorado -->
    <a-entity mindar-image-target="targetIndex: 5" data-index="5" id="target-5">
      <a-entity gltf-model="#model-5" scale="0.4 0.4 0.4" position="0 0 0" rotation="0 -90 0"
        custom-rotation="sensitivity: 0.2"></a-entity>
    </a-entity>

    <!-- 6: jabiru -->
    <a-entity mindar-image-target="targetIndex: 6" data-index="6" id="target-6">
      <a-entity gltf-model="#model-6" scale="0.05 0.05 0.05" position="0 -0.2 0" rotation="0 0 0"
        custom-rotation="sensitivity: 0.2"></a-entity>
    </a-entity>

    <!-- 7: jacana -->
    <a-entity mindar-image-target="targetIndex: 7" data-index="7" id="target-7">
      <a-entity gltf-model="#model-7" scale="0.6 0.6 0.6" position="0 -0.2 -0.2" rotation="0 0 0"
        custom-rotation="sensitivity: 0.2"></a-entity>
    </a-entity>

    <!-- 8: jaguarete -->
    <a-entity mindar-image-target="targetIndex: 8" data-index="8" id="target-8">
      <a-entity gltf-model="#model-8" scale="0.005 0.005 0.005" position="0 0 0" rotation="0 -90 0"
        custom-rotation="sensitivity: 0.2"></a-entity>
    </a-entity>

    <!-- 9: nutria -->
    <a-entity mindar-image-target="targetIndex: 9" data-index="9" id="target-9">
      <a-entity gltf-model="#model-9" scale="0.2 0.2 0.2" position="0 0 0" rotation="0 -90 0"
        custom-rotation="sensitivity: 0.2"></a-entity>
    </a-entity>

    <!-- 10: osohormiguero -->
    <a-entity mindar-image-target="targetIndex: 10" data-index="10" id="target-10">

      <a-entity gltf-model="#model-10" scale="0.15 0.15 0.15" position="0 0 0" rotation="0 -90 0"
        custom-rotation="sensitivity: 0.2"></a-entity>
    </a-entity>

    <!-- 11: tararira -->
    <a-entity mindar-image-target="targetIndex: 11" data-index="11" id="target-11">
      <a-entity gltf-model="#model-11" scale="0.2 0.2 0.2" position="0 0 0" rotation="0 -90 0"
        custom-rotation="sensitivity: 0.2"></a-entity>
    </a-entity>

    <!-- 12: tordo -->
    <a-entity mindar-image-target="targetIndex: 12" data-index="12" id="target-12">
      <a-entity gltf-model="#model-12" scale="0.8 0.8 0.8" position="0 0 0" rotation="0 -90 0"
        custom-rotation="sensitivity: 0.2"></a-entity>
    </a-entity>

    <!-- 13: venado -->
    <a-entity mindar-image-target="targetIndex: 13" data-index="13" id="target-13">

      <a-entity gltf-model="#model-13" scale="0.15 0.15 0.15" position="0 -0.2 0" rotation="0 -90 0"
        custom-rotation="sensitivity: 0.2"></a-entity>
    </a-entity>

    <!-- 14: yacare -->
    <a-entity mindar-image-target="targetIndex: 14" data-index="14" id="target-14">

      <a-entity gltf-model="#model-14" scale="0.28 0.28 0.28" position="0 0 0" rotation="0 -90 0"
        custom-rotation="sensitivity: 0.2"></a-entity>
    </a-entity>

    <!-- 15: yetapa -->
    <a-entity mindar-image-target="targetIndex: 15" data-index="15" id="target-15">

      <a-entity gltf-model="#model-15" scale="0.6 0.6 0.6" position="0 0 0" rotation="0 -90 0"
        custom-rotation="sensitivity: 0.2"></a-entity>

    </a-entity>

    <!-- Luz Ambiente -->

    <!-- <a-light type="ambient" color="#ffcc00" intensity="0.1"></a-light> -->

    <!-- Luz Spot 1 (Izquierda) -->
    <a-entity light type="spot" color="##ffcc00" intensity="0.1" position="-1 2 0" rotation="-90 0 0" angle="45"
      penumbra="0.5" decay="2">
    </a-entity>
    <!-- Luz Spot 2 (Derecha) -->
    <a-entity light type="spot" color="##ffcc00" intensity="0.1" position="1 2 0" rotation="-90 0 0" angle="45"
      penumbra="0.5" decay="2">
    </a-entity>
    <!-- Luz Direccional color -->
    <!-- <a-entity light="type: directional; color: #333; intensity: 1"></a-entity>  -->


    <a-camera id="camera" position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>




</body>
<script src="lib/system_monitor.js"></script>
<script src="lib/rotation.js"></script>
<script src="lib/animations.js"></script>
<script src="lib/main.js"></script>

  <script>

    // Mostrar la pantalla de carga al inicio
    document.addEventListener('DOMContentLoaded', () => {
      const splashScreen = document.getElementById('splash-screen');

      // Escuchar el evento de carga completa de la escena
      const scene = document.querySelector('a-scene');
      scene.addEventListener('loaded', () => {
        // Ocultar la pantalla de carga cuando todo esté cargado
        splashScreen.style.display = 'none';
      });
    });

        console.log('Ibera-AR version 0.4.6');
  </script>
</html>
