<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script>
      AFRAME.registerComponent('additive-shader', {
        schema: {
          targetIndex: { type: 'number', default: 0 }
        },
        
        init: function () {
          const parentEl = this.el.parentElement;
          if (!parentEl) {
            console.error('No parent element');
            return;
          }

          const setupMaterial = async () => {
            const mindarTarget = parentEl.components['mindar-image-target'];
            if (!mindarTarget) {
              console.error('Parent does not have mindar-image-target component');
              return;
            }
            const targetIndex = mindarTarget.data.targetIndex;
            const video = document.getElementById(`video${targetIndex}`);
            if (!video) {
              console.error(`Video element video${targetIndex} not found`);
              return;
            }

            // Forzar reproducción con interacción del usuario
            try {
              await video.play();
            } catch (error) {
              console.error('Error al reproducir el video:', error);
              // Botón de fallback para móviles
              const playButton = document.createElement('button');
              playButton.innerText = 'Tocar para reproducir';
              playButton.style.position = 'fixed';
              playButton.style.top = '50%';
              playButton.style.left = '50%';
              playButton.style.transform = 'translate(-50%, -50%)';
              playButton.style.zIndex = 1000;
              playButton.onclick = async () => {
                try {
                  await video.play();
                  playButton.remove();
                } catch (error) {
                  console.error('Error en reproducción manual:', error);
                }
              };
              document.body.appendChild(playButton);
              return;
            }

            // Configurar textura y material
            const texture = new THREE.VideoTexture(video);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.format = THREE.RGBFormat;
            texture.needsUpdate = true;

            const material = new THREE.ShaderMaterial({
              uniforms: {
                baseTexture: { value: texture },
                threshold: { value: 0.6 }
              },
              vertexShader: `
                varying vec2 vUv;
                void main() {
                  vUv = uv;
                  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
              `,
              fragmentShader: `
                uniform sampler2D baseTexture;
                uniform float threshold;
                varying vec2 vUv;

                void main() {
                  vec4 color = texture2D(baseTexture, vUv);
                  float luminance = dot(color.rgb, vec3(0.299, 0.587, 0.114)); 
                  if (luminance < threshold) {
                    discard; 
                  }
                  gl_FragColor = vec4(color.rgb, 1.0); 
                }
              `,
              transparent: true,
              blending: THREE.AdditiveBlending,
              depthTest: false
            });

            this.el.getObject3D('mesh').material = material;

            // Actualizar textura al reproducir
            video.addEventListener('play', () => {
              texture.needsUpdate = true;
            });
          };

          // Esperar a que el padre esté listo
          if (parentEl.hasLoaded) {
            setupMaterial();
          } else {
            parentEl.addEventListener('loaded', setupMaterial);
          }
        }
      });
    </script>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: assets/muitu.mind;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: true"
    >
      <a-assets>
        <video id="video0" preload="auto" 
          src="assets/muitu.webm" 
          autoplay loop muted playsinline 
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane 
          width="0.9" 
          height="0.6" 
          position="0 0 0" 
          additive-shader="targetIndex: 0"
        ></a-plane>
      </a-entity>
    </a-scene>
  </body>
</html>
