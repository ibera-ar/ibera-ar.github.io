<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iberá AR</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
            color: #333333;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
        }

        .header h1 {
            font-size: 2.5em;
            margin: 0 0 15px;
            color: #2d542c;
        }

        .header p {
            font-size: 1.2em;
            margin: 0 0 20px;
            max-width: 600px;
        }

        .header img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
            list-style: none;
            padding: 0;
        }

        .menu a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            padding: 20px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: block;
            transform: perspective(1px) translateZ(0);
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .menu a:hover {
            background: linear-gradient(135deg, #45a049, #3d8b40);
            transform: scale(1.02);
        }

        .menu a:active {
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transform: scale(0.95);
            transition-duration: 0.1s;
        }

        /* Efecto de onda al hacer clic */
        .menu a:active::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%);
            border-radius: 50%;
            animation: ripple 0.6s ease-out forwards;
        }

        @keyframes ripple {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0.6;
            }
            100% {
                transform: translate(-50%, -50%) scale(2);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="icon.jpg" alt="Icono">
        <h1>Iberá AR</h1>
        <p>Descubre la experiencia en realidad aumentada de Casa Iberá</p>
    </div>

    <ul class="menu">
        <li><a href="postas2.html">Experiencia Sector Postas</a></li>
        <li><a href="panel.html">Experiencia Sector Panel</a></li>
    </ul>
</body>
</html>
