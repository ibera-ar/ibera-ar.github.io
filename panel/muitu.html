<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script>
      // Componente para aplicar blending aditivo mediante un shader personalizado
      AFRAME.registerComponent('additive-shader', {
        init: function () {
          const video = document.getElementById('muitu');
          const texture = new THREE.VideoTexture(video);

          const material = new THREE.ShaderMaterial({
            uniforms: {
              baseTexture: { value: texture },
              threshold: { value: 0.6 }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D baseTexture;
              uniform float threshold;
              varying vec2 vUv;
              void main() {
                vec4 color = texture2D(baseTexture, vUv);
                float luminance = dot(color.rgb, vec3(0.299, 0.587, 0.114)); 
                if (luminance < threshold) {
                  discard; 
                }
                gl_FragColor = vec4(color.rgb, 1.0); 
              }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthTest: false
          });

          this.el.getObject3D('mesh').material = material;
        }
      });

      // Listener para iniciar la reproducción del video tras la primera interacción del usuario en dispositivos móviles
      document.addEventListener('touchstart', function initVideo() {
        const video = document.getElementById('muitu');
        if (video.paused) {
          video.play();
        }
        document.removeEventListener('touchstart', initVideo);
      });
    </script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: muitu.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="muitu" preload="auto" src="muitu.webm" autoplay="true" loop="true" playsinline="true" muted="true"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane width="0.9" height="0.6" position="0 0 0" additive-shader></a-plane>
      </a-entity>
    </a-scene>
  </body>
</html>
