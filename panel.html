<!DOCTYPE html>

    <style>

<script>  AFRAME.registerComponent('additive-shader', {
  schema: { 
    targetIndex: { type: 'number', default: 0 }
  },

  init: function () {
    const videoId = `video${this.data.targetIndex}`;
    const video = document.getElementById(videoId);

    const renderer = document.querySelector('a-scene').renderer;
renderer.extensions.get('OES_texture_float_linear');
    if (!video) {
      console.error(`[Shader] Video ${videoId} no encontrado`);
      return;
    }

    const floatLinearExt = renderer.extensions.get('OES_texture_float_linear');
if (!floatLinearExt) console.warn("Floating point textures not supported");

            // // 1. Forzar actualización de textura en móvil
            // let texture = null;
            // const updateTexture = () => {
            // if (texture) texture.needsUpdate = true;
            //     };

    const createMaterial = () => {
      const texture = new THREE.VideoTexture(video);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.format = THREE.RGBAFormat;

      const material = new THREE.ShaderMaterial({
        uniforms: {
          baseTexture: { value: texture },
          threshold: { value: 0.2 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          precision highp float;
          uniform sampler2D baseTexture;
          uniform float threshold;
          varying vec2 vUv;
          
          void main() {
            vec4 color = texture2D(baseTexture, vUv);
            // Cálculo optimizado para móvil
            float luminance = color.g * 0.8 + (color.r + color.b) * 0.1;
            float alpha = step(threshold, luminance);
            gl_FragColor = vec4(color.rgb * alpha, alpha);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthTest: false
      });

      this.el.getObject3D('mesh').material = material;
    };

    if (video.readyState >= video.HAVE_CURRENT_DATA) {
      createMaterial();
    } else {
      video.addEventListener('loadeddata', createMaterial);
      video.addEventListener('error', (e) => {
        console.error(`[Video ${videoId}] Error:`, e.target.error);
      });
    }
  }
});

document.addEventListener('DOMContentLoaded', () => {
  const videos = Array.from(document.querySelectorAll('video'));
  
  const playAllVideos = async () => {
    try {
      await Promise.all(videos.map(video => {
        if (video.paused && video.readyState > 2) {
          return video.play();
        }
      }));
    } catch (error) {
      console.log('Reintentando reproducción...');
      setTimeout(playAllVideos, 500);
    }
  };

  document.addEventListener('touchstart', playAllVideos, { once: true });
  document.addEventListener('click', playAllVideos, { once: true });
});</script>


  </head>

    <script>

  
  
    function initTargetListeners(targetEl) {
      targetEl.addEventListener('targetFound', () => {
        console.log('Target found:', targetEl.id);

      });
  
      targetEl.addEventListener('targetLost', () => {
        console.log('Target lost:', targetEl.id);

      });
    }
  
    const targets = document.querySelectorAll('[mindar-image-target]');
    targets.forEach((targetEl) => {
      initTargetListeners(targetEl);
    });


    document.querySelectorAll('video').forEach(video => {
  video.addEventListener('error', (e) => {
    console.error('Error en video:', e.target.error);
  });
});

console.log('Ibera-AR version 0.9.1');
