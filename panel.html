<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script>
      AFRAME.registerComponent('optimized-shader', {
        init: function () {
          const video = document.getElementById('muitu');
          const texture = new THREE.VideoTexture(video);
          
          // Optimización de muestreo de textura
          texture.minFilter = THREE.NearestFilter;
          texture.magFilter = THREE.NearestFilter;

          const material = new THREE.ShaderMaterial({
            uniforms: {
              baseTexture: { value: texture },
              threshold: { value: 0.4 } // Umbral reducido para mayor eficiencia
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D baseTexture;
              uniform float threshold;
              varying vec2 vUv;
              
              void main() {
                vec4 color = texture2D(baseTexture, vUv);
                
                // Cálculo de luminancia simplificado (más rápido)
                float luminance = (color.r + color.g + color.b) / 3.0;
                
                // Evitar discard usando alpha blending
                if (luminance < threshold) {
                  gl_FragColor = vec4(0.0, 0.0, 0.0, 0.0);
                } else {
                  gl_FragColor = vec4(color.rgb, 1.0);
                }
              }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            // Optimización de actualización
            uniformsNeedUpdate: true
          });

          this.el.getObject3D('mesh').material = material;
        }
      });

      document.addEventListener('touchstart', function initVideo() {
        const video = document.getElementById('muitu');
        if (video.paused) {
          video.play().catch(error => {
            console.log('Reintentando reproducción...');
            // Forzar reproducción en segundo plano
            setTimeout(() => video.play(), 500);
          });
        }
        document.removeEventListener('touchstart', initVideo);
      });
    </script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: assets/muitu.mind;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false"
             renderer="antialias: false; highRefreshRate: true">
             
      <a-assets>
        <!-- Optimización de video -->
        <video id="muitu" 
               preload="auto" 
               src="assets/muitu.webm" 
               autoplay 
               loop 
               playsinline 
               muted
               crossorigin="anonymous">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Geometría optimizada -->
        <a-plane width="1.2" 
                 height="0.9" 
                 position="0 0 0" 
                 optimized-shader
                 >
        </a-plane>
      </a-entity>
    </a-scene>
  </body>
</html>
